  --ink:#0F2557; --muted:#56607F; --faint:#8790AB;
  --canvas:#EEF2F8; --glass:rgba(255,255,255,.72); --glass-lo:rgba(255,255,255,.5); --edge:rgba(255,255,255,.8);
  --hair:rgba(15,37,87,.09); --hair2:rgba(15,37,87,.05);
  --ok:#137A4B; --ok-bg:rgba(19,122,75,.11); --warn:#995800; --warn-bg:rgba(230,150,20,.16); --off-bg:rgba(15,37,87,.07);
  --shadow:0 14px 44px rgba(15,37,87,.09); --shadow-sm:0 6px 18px rgba(15,37,87,.08);
  --spring:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font-family:"Poppins","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.5;overflow-x:hidden}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy2);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* Canvas */
.canvas{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(165deg,#F4F7FC 0%,#E9EFF8 50%,#F1EDF3 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(80px)}
.b1{width:52vmax;height:52vmax;left:-18vmax;bottom:-26vmax;background:radial-gradient(circle,rgba(200,16,46,.30),rgba(225,29,72,.12) 50%,transparent 70%);animation:d1 28s ease-in-out infinite alternate}
.b2{width:50vmax;height:50vmax;right:-20vmax;top:-24vmax;background:radial-gradient(circle,rgba(27,54,93,.28),rgba(15,37,87,.08) 55%,transparent 70%);animation:d2 32s ease-in-out infinite alternate}
.b3{width:44vmax;height:44vmax;right:-8vmax;bottom:-22vmax;background:radial-gradient(circle,#CFE0F5,transparent 68%);animation:d3 36s ease-in-out infinite alternate}
.b4{width:30vmax;height:30vmax;left:34vw;top:20vh;background:radial-gradient(circle,rgba(246,211,218,.8),transparent 70%);animation:d2 42s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate(12vmax,-8vmax) scale(1.1)}}
@keyframes d2{to{transform:translate(-10vmax,8vmax) scale(.92)}}
@keyframes d3{to{transform:translate(-12vmax,-6vmax) scale(1.08)}}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(15,37,87,.05) 1px,transparent 1px);background-size:5px 5px}

/* Glass */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9)}
.glass-lo{background:var(--glass-lo);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9)}
.solid{background:#fff;border:1px solid #fff;box-shadow:var(--shadow-sm)}
.r-card{border-radius:26px}
.lift{transition:transform .3s var(--out),box-shadow .3s}
.lift:hover{transform:translateY(-4px);box-shadow:0 24px 56px rgba(15,37,87,.15),inset 0 1px 0 #fff}

/* Frame */
.shell{position:relative;z-index:1;padding-block:22px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.frame{max-width:1480px;margin:0 auto;border-radius:34px;padding:20px;display:grid;grid-template-columns:224px minmax(0,1fr) 330px;gap:22px;align-items:start;background:rgba(255,255,255,.38);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid var(--edge);box-shadow:0 30px 80px rgba(15,37,87,.10),inset 0 1px 0 #fff}

/* Orb */
.orb{width:var(--s,40px);height:var(--s,40px);border-radius:50%;flex:none;position:relative;
  background:radial-gradient(circle at 32% 28%,#FFE6EA 0%,#F27A8E 26%,#C8102E 58%,#0F2557 100%);
  box-shadow:0 8px 24px rgba(200,16,46,.32),inset -4px -6px 12px rgba(15,37,87,.4),inset 3px 4px 8px rgba(255,255,255,.55);animation:float 6s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(circle,rgba(225,29,72,.35),transparent 65%);filter:blur(8px);z-index:-1;animation:breathe 4.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px) rotate(10deg)}}
@keyframes breathe{50%{transform:scale(1.3);opacity:.5}}

/* Sidebar */
.side{position:sticky;top:20px;display:flex;flex-direction:column;gap:4px;padding:4px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 20px}
.brand b{font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--navy)}
.brand b span{color:var(--crimson)}
.grp{font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:14px 16px 6px}
.nav{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 16px;border-radius:999px;border:1px solid transparent;background:transparent;font-weight:500;color:var(--navy);text-align:left;transition:background .25s,box-shadow .25s,transform .2s var(--out)}
.nav svg{color:var(--muted);transition:color .2s,transform .3s var(--spring)}
.nav:hover{background:rgba(255,255,255,.5);transform:translateX(3px)}
.nav:hover svg{transform:scale(1.12)}
.nav.on{background:#fff;border-color:#fff;box-shadow:var(--shadow-sm);font-weight:600}
.nav.on svg{color:var(--navy)}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:600;background:var(--crimson);color:#fff;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.nav .cnt.soft{background:rgba(15,37,87,.08);color:var(--navy)}

/* Buttons & pills */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.6);font-weight:500;color:var(--navy);white-space:nowrap;text-decoration:none;transition:background .2s,transform .15s var(--out),box-shadow .2s,color .2s}
.btn:hover{background:#fff}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn.xs{height:28px;padding:0 11px;font-size:12px}
.btn.icon{width:42px;padding:0}
.btn.sm.icon{width:34px}
.btn.red{background:var(--crimson);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(200,16,46,.28)}
.btn.red:hover{background:#A90D26;box-shadow:0 10px 26px rgba(200,16,46,.38)}
.btn.navy{background:var(--navy);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(15,37,87,.22)}
.btn.navy:hover{background:#0A1B42}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(255,255,255,.6)}
.btn.ok{background:var(--ok);border-color:transparent;color:#fff}
.btn.zoom{background:#2D8CFF;border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(45,140,255,.28)}
.btn.zoom:hover{background:#1F78E6}
.circle{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid #fff;background:#fff;box-shadow:var(--shadow-sm);position:relative;color:var(--navy);transition:transform .25s var(--spring)}
.circle:hover{transform:scale(1.08)}
.circle .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--crimson);border:2px solid #fff;animation:ping 2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(200,16,46,.5)}100%{box-shadow:0 0 0 9px rgba(200,16,46,0)}}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.45);font-weight:500;font-size:13px;color:var(--muted);transition:all .25s var(--out)}
.tab:hover{background:rgba(255,255,255,.8);color:var(--navy)}
.tab.on{background:#fff;color:var(--navy);font-weight:600;box-shadow:var(--shadow-sm)}
.seg{position:relative;display:inline-flex;border-radius:999px;padding:4px;background:rgba(255,255,255,.45);border:1px solid var(--edge)}
.seg button{position:relative;z-index:1;border:0;background:transparent;height:32px;padding:0 16px;border-radius:999px;font-weight:500;color:var(--muted);transition:color .2s}
.seg button.on{color:var(--navy);font-weight:600}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:#fff;box-shadow:var(--shadow-sm);transition:transform .35s var(--spring),width .35s var(--spring)}
.arrow{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--crimson);box-shadow:var(--shadow-sm);transition:transform .35s var(--spring),background .2s,color .2s;flex:none}
.group:hover .arrow,.arrow:hover{transform:rotate(45deg) scale(1.08);background:var(--crimson);color:#fff}
.play{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--crimson);box-shadow:var(--shadow-sm);border:0;transition:transform .25s var(--spring),background .2s,color .2s;text-decoration:none;flex:none}
.play:hover{transform:scale(1.12);background:var(--crimson);color:#fff}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.tag.navy{background:rgba(15,37,87,.08);color:var(--navy)}
.tag.verified{background:var(--navy);color:#fff}
.tag.crit{background:var(--crimson);color:#fff}
.tag.crit-soft{background:rgba(200,16,46,.09);color:var(--crimson)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.off{background:var(--off-bg);color:var(--muted)}
.tag.white{background:rgba(255,255,255,.85);color:var(--navy)}
.chip{font-size:11.5px;background:rgba(255,255,255,.7);border:1px solid #fff;border-radius:999px;padding:3px 10px;color:var(--navy);white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 11px}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-confirmed{background:var(--ok-bg);color:var(--ok)}
.s-pending{background:var(--warn-bg);color:var(--warn)}
.s-completed{background:var(--off-bg);color:var(--muted)}
.s-cancelled{background:rgba(200,16,46,.09);color:var(--crimson)}
.eyebrow{font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}

/* Mesh art */
.art{position:relative;overflow:hidden;isolation:isolate}
.art .paint{position:absolute;inset:-28%;filter:blur(20px) saturate(135%);transform:rotate(var(--rot,0deg));transition:transform 1.4s var(--out);z-index:-1}
.art .paint::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(var(--rot2,100deg),rgba(255,255,255,.16) 0 2px,transparent 2px 15px);mix-blend-mode:soft-light}
.group:hover .art .paint,.art:hover .paint{transform:rotate(calc(var(--rot,0deg) + 9deg)) scale(1.08)}
.veil{position:absolute;inset:auto 0 0;height:60%;background:linear-gradient(transparent,rgba(255,255,255,.82));z-index:0;pointer-events:none}
.avatar{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none;border:3px solid #fff;box-shadow:var(--shadow-sm);letter-spacing:.02em}

/* Inputs */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:500;color:var(--muted)}
.inp{height:44px;border:1px solid rgba(15,37,87,.1);border-radius:14px;background:rgba(255,255,255,.8);padding:0 14px;width:100%;min-width:0;color:var(--navy);transition:box-shadow .2s,border-color .2s}
textarea.inp{height:auto;min-height:84px;padding:10px 14px;resize:vertical}
.inp:focus{outline:0;border-color:var(--navy2);box-shadow:0 0 0 4px rgba(27,54,93,.12)}
.inp.bad{border-color:var(--crimson);box-shadow:0 0 0 4px rgba(200,16,46,.1)}
.err{font-size:12px;color:var(--crimson);font-weight:500}
.help{font-size:11.5px;color:var(--faint)}
.pillin{display:flex;align-items:center;gap:10px;height:46px;border-radius:999px;padding:0 6px 0 18px;background:#fff;border:1px solid #fff;box-shadow:var(--shadow-sm)}
.pillin input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--navy)}
.pillin input::placeholder{color:var(--faint)}
.pillin:focus-within{box-shadow:var(--shadow-sm),0 0 0 3px rgba(27,54,93,.18)}
input[type=range]{accent-color:var(--crimson)}

/* Animations */
.enter{animation:enter .5s var(--out) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stag>*{animation:enter .5s var(--out) both;animation-delay:calc(var(--i,0) * 55ms)}
.pop{animation:popIn .4s var(--spring) both}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.heart.on{color:var(--crimson)}
.heart.on svg{fill:currentColor;animation:hpop .45s var(--spring)}
@keyframes hpop{40%{transform:scale(1.45)}}
.bm.on{color:var(--crimson)}
.bm.on svg{fill:currentColor;animation:hpop .45s var(--spring)}

/* Feed */
.post{border-radius:24px;padding:18px}
.kind-offer{background:rgba(200,16,46,.09);color:var(--crimson)}
.kind-announcement{background:rgba(15,37,87,.08);color:var(--navy)}
.kind-request{background:var(--warn-bg);color:var(--warn)}

/* Calendar */
.cal-card{border-radius:26px;overflow:hidden;padding:6px}
.cal-scroll{overflow:auto;max-height:calc(100vh - 330px);min-height:440px;border-radius:21px;overscroll-behavior:contain}
.cal{display:grid;grid-template-columns:58px repeat(var(--days),minmax(var(--colmin),1fr));min-width:max-content}
.ch{position:sticky;top:0;z-index:5;background:rgba(250,251,254,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--hair);padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center}
.ch.corner{left:0;z-index:7;justify-content:flex-end;font-size:10px;color:var(--faint)}
.ch small{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ch .n{font-weight:600;font-size:19px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.ch.today .n{background:var(--crimson);color:#fff;box-shadow:0 6px 16px rgba(200,16,46,.35)}
.ch.today small{color:var(--crimson)}
.gutter{position:sticky;left:0;z-index:4;background:rgba(250,251,254,.75);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hr{position:relative}
.hr span{position:absolute;top:-8px;right:8px;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.col{position:relative;overflow:hidden;cursor:cell;border-left:1px solid var(--hair2);background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(var(--hair2) 1px,transparent 1px);background-size:100% var(--hh),100% calc(var(--hh) / 2)}
.col.today{background-color:rgba(255,255,255,.4)}
.hint{position:absolute;left:5px;right:5px;border-radius:14px;border:1.5px dashed rgba(27,54,93,.45);background:rgba(255,255,255,.55);pointer-events:none;font-size:12px;font-weight:600;color:var(--navy2);padding:5px 10px;transition:top .12s var(--out)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--crimson);z-index:3;pointer-events:none;box-shadow:0 0 10px rgba(200,16,46,.5)}
.now::before{content:"";position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--crimson);animation:ping 2s ease-out infinite}
.ripple{position:absolute;border-radius:50%;background:rgba(27,54,93,.2);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none;width:80px;height:80px;margin:-40px 0 0 -40px}
@keyframes ripple{to{transform:scale(3);opacity:0}}
.ev{position:absolute;z-index:2;text-align:left;border-radius:14px;padding:6px 10px;overflow:hidden;color:var(--navy);
  background:linear-gradient(140deg,color-mix(in srgb,var(--c) 24%,#fff),color-mix(in srgb,var(--c) 8%,#fff));border:1px solid #fff;
  box-shadow:0 6px 16px color-mix(in srgb,var(--c) 18%,transparent);display:flex;flex-direction:column;gap:1px;transition:transform .22s var(--out),box-shadow .22s;animation:evIn .45s var(--out) both;animation-delay:calc(var(--i) * 30ms)}
.ev:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 12px 26px color-mix(in srgb,var(--c) 28%,transparent);z-index:6}
.ev .t{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ev .s{font-weight:600;font-size:12.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .w{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.pending{background:rgba(255,255,255,.65);border:1.5px dashed color-mix(in srgb,var(--c) 75%,transparent);box-shadow:none}
.ev.completed{background:rgba(255,255,255,.42);box-shadow:none}
.ev.completed .s,.ev.completed .t{color:var(--faint)}
.ev.short{flex-direction:row;align-items:center;gap:6px;padding-top:2px;padding-bottom:2px}
@keyframes evIn{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
.dir-next .col,.dir-next .ch:not(.corner){animation:inR .4s var(--out) both}
.dir-prev .col,.dir-prev .ch:not(.corner){animation:inL .4s var(--out) both}
@keyframes inR{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.strip button{border:1px solid var(--edge);background:rgba(255,255,255,.45);border-radius:18px;padding:7px 0;display:flex;flex-direction:column;align-items:center;position:relative;transition:all .2s var(--out)}
.strip button.on{background:#fff;box-shadow:var(--shadow-sm)}
.strip small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.strip b{font-weight:600;font-size:16px}
.strip .td b{color:var(--crimson)}
.strip i{width:5px;height:5px;border-radius:50%;background:var(--crimson);position:absolute;top:8px;right:9px}

/* Concierge */
.hello{position:relative;overflow:hidden}
.hello::before{content:"";position:absolute;left:50%;top:0;width:240px;height:150px;margin-left:-120px;background-image:radial-gradient(rgba(15,37,87,.18) 1px,transparent 1.3px);background-size:9px 9px;-webkit-mask-image:radial-gradient(closest-side,#000,transparent);mask-image:radial-gradient(closest-side,#000,transparent);pointer-events:none}
.bub{max-width:88%;padding:9px 13px;border-radius:18px;font-size:13px;animation:bub .35s var(--spring) both}
.bub.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:6px}
.bub.bot{align-self:flex-start;background:#fff;color:var(--navy);border-bottom-left-radius:6px;box-shadow:var(--shadow-sm)}
@keyframes bub{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:none}}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:tdot 1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{50%{transform:translateY(-4px);opacity:.4}}

/* Modal */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(15,37,87,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);border:1px solid #fff;border-radius:30px;box-shadow:0 30px 80px rgba(15,37,87,.25);width:min(var(--w,580px),100%);max-height:calc(100vh - 32px);overflow:auto;animation:mIn .4s var(--spring) both}
@keyframes mIn{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.scrim.closing{animation:fadeOut .17s ease both}
.scrim.closing .modal{animation:mOut .17s ease both}
@keyframes fadeOut{to{opacity:0}}
@keyframes mOut{to{opacity:0;transform:translateY(8px) scale(.96)}}
.mbody>*{animation:enter .45s var(--out) both}
.mbody>*:nth-child(2){animation-delay:.04s}.mbody>*:nth-child(3){animation-delay:.08s}.mbody>*:nth-child(4){animation-delay:.12s}.mbody>*:nth-child(5){animation-delay:.16s}.mbody>*:nth-child(6){animation-delay:.2s}.mbody>*:nth-child(7){animation-delay:.24s}
.stars button{border:0;background:transparent;padding:2px;color:rgba(15,37,87,.15);transition:color .15s,transform .25s var(--spring)}
.stars button:hover{transform:scale(1.18)}
.stars button.on{color:#F2A517;animation:hpop .4s var(--spring)}
.gold{color:#F2A517}
.progress{height:6px;border-radius:999px;background:rgba(255,255,255,.5);overflow:hidden}

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pYmd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const monOf=d=>addD(d,-((d.getDay()+6)%7));
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const toHM=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const f12=m=>{let h=Math.floor(m/60),mm=m%60,ap=h>=12?'PM':'AM';h=h%12||12;return mm?`${h}:${pad(mm)} ${ap}`:`${h} ${ap}`};
const uid=()=>Math.random().toString(36).slice(2,10);
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const today=new Date();const todayStr=ymd(today);const todayIdx=(today.getDay()+6)%7;
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const peso=n=>'₱'+Math.round(n).toLocaleString('en-PH');
const dateLabel=s=>{const d=pYmd(s);return `${DAYS[d.getDay()].slice(0,3)}, ${MON[d.getMonth()].slice(0,3)} ${d.getDate()}`};
const cx=(...a)=>a.filter(Boolean).join(' ');

/* ---------- layout for calendar ---------- */
const evEnd=e=>{const a=toMin(e.start),b=toMin(e.end);return b>a?b:24*60};
function layout(list){
 list=[...list].sort((a,b)=>toMin(a.start)-toMin(b.start)||evEnd(b)-evEnd(a));
 const cl=[];let cur=[],end=-1;
 for(const e of list){const s=toMin(e.start);if(cur.length&&s>=end){cl.push(cur);cur=[];end=-1}cur.push(e);end=Math.max(end,evEnd(e))}
 if(cur.length)cl.push(cur);
 const out=[];for(const c of cl){const lanes=[],pl=[];for(const e of c){let i=lanes.findIndex(x=>x<=toMin(e.start));if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=evEnd(e);pl.push({e,lane:i})}pl.forEach(p=>out.push({...p,n:lanes.length}))}
 return out;
}

function Find({db,act,params,q}){
 const[subject,setSubject]=useState(params?.subject||'Any');
 const[cat,setCat]=useState(params?.cat||'Any');
 const rateCap=Math.max(200,Math.ceil(Math.max(0,...db.mentors.map(m=>+m.rate||0))/50)*50);const[maxRate,setMaxRate]=useState(null);const anyRate=maxRate===null||maxRate>=rateCap;
 const[minRating,setMinRating]=useState(0);
 const[avail,setAvail]=useState('any');
 const[sort,setSort]=useState('rating');
 useEffect(()=>{if(params?.subject){setSubject(params.subject);setCat('Any')}if(params?.cat){setCat(params.cat);setSubject('Any')}},[params]);
 const qq=(q||'').trim();
 let ms=qq?matchMentors(db.mentors,qq):[...db.mentors];
 if(qq&&!ms.length)ms=db.mentors.filter(m=>(m.name+' '+m.course+' '+m.subjects.join(' ')).toLowerCase().includes(qq.toLowerCase()));
 ms=ms.filter(m=>(subject==='Any'||m.subjects.includes(subject))&&(cat==='Any'||m.subjects.some(s=>SUBJ[s]?.cat===cat||(cat==='Programming'&&s.includes('Circuits'))))&&(anyRate||(+m.rate||0)<=maxRate)&&rating(m)>=minRating&&(avail==='any'||(avail==='today'&&availToday(m))||(avail==='weekend'&&m.days.some(d=>d>=5))||(avail==='evening'&&toMin(m.to)>=19*60)));
 ms.sort((a,b)=>sort==='rating'?rating(b)-rating(a):sort==='low'?a.rate-b.rate:sort==='reviews'?b.reviews.length-a.reviews.length:b.taught-a.taught);
 const sig=[subject,cat,maxRate,minRating,avail,sort,qq].join('|');
 const reset=()=>{setSubject('Any');setCat('Any');setMaxRate(null);setMinRating(0);setAvail('any');setSort('rating');act.setQ('')};
 const narrow=useMedia('(max-width: 760px)');const[showF,setShowF]=useState(false);
 const nOn=[subject!=='Any',cat!=='Any',!anyRate,minRating!==0,avail!=='any'].filter(Boolean).length;
 return html`<div className="flex flex-col gap-5">
  ${narrow&&html`<button type="button" className="btn w-full !justify-between" aria-expanded=${showF} onClick=${()=>setShowF(v=>!v)}><span className="inline-flex items-center gap-2"><${Icon} n="search" s=${16}/>Filters${nOn?html` <span className="cnt-badge">${nOn}</span>`:''}</span><span className="text-xs muted">${showF?'Hide':'Subject, rate, rating…'}</span></button>`}

function Become({db,act,edit}){
 const me=db.user.mentorId&&db.mentors.find(m=>m.id===db.user.mentorId);

 const[subs,setSubs]=useState(me?me.subjects:[]);const[rate,setRate]=useState(me?me.rate:150);const[bio,setBio]=useState(me?me.bio:'');
 const[modes,setModes]=useState(me?offers(me):['online','f2f']);
 const[days,setDays]=useState(me?me.days:[0,2,4]);const[from,setFrom]=useState(me?me.from:'18:00');const[to,setTo]=useState(me?me.to:'20:00');
 const[files,setFiles]=useState([]);const[vids,setVids]=useState([]);const[errs,setErrs]=useState({});

 if(me&&!editing)return html`<div className="flex flex-col gap-4"><div className="glass r-card p-6 flex flex-wrap items-center gap-4 enter"><${Avatar} m=${me} s=${64}/><div className="flex-1 min-w-0"><b className="text-lg font-semibold">You're a KnowHow mentor</b><p className="m-0 muted text-sm">${me.verified?'Your credentials are verified. Learners can book you now.':'An admin is reviewing your credentials. You can still receive booking requests.'}</p></div><button type="button" className="btn" onClick=${()=>setEditing(true)}><${Icon} n="userplus" s=${15}/>Edit profile</button><button type="button" className="btn red" onClick=${()=>act.nav('profile',{id:me.id})}>View my profile</button></div></div>`;
 const togg=(arr,set,v)=>set(arr.includes(v)?arr.filter(x=>x!==v):[...arr,v]);
 const times=[];for(let m=7*60;m<=22*60;m+=30)times.push(toHM(m));
 const submit=e=>{e.preventDefault();const er={};
  if(!subs.length)er.subs='Pick at least one subject you can teach.';
  if(bio.trim().length<30)er.bio='Write at least 30 characters so learners know your teaching style.';
  if(!days.length)er.days='Choose the days you are available.';
  if(toMin(to)<=toMin(from))er.time='End time must be after start time.';
  if(!(rate>=50&&rate<=1000))er.rate='Set a rate between ₱50 and ₱1,000 per hour.';
  setErrs(er);if(Object.keys(er).length)return;
  setSaving(true);Promise.resolve(act.becomeMentor({subjects:subs,rate:+rate,bio:bio.trim(),days:[...days].sort(),from,to,files,vids,photo,modes})).finally(()=>setSaving(false))};
 const pick=(e,set,kind)=>{const max=kind==='Video'?50:10;const all=[...e.target.files];const big=all.filter(f=>f.size>max*1024*1024);
  if(big.length)act.toast(`${big[0].name} is too big. ${kind==='Video'?'Videos':'Files'} must be under ${max} MB.`);
  const fs=all.filter(f=>f.size<=max*1024*1024).map(f=>({name:f.name,kind,file:f}));set(x=>[...x,...fs]);e.target.value=''};
 return html`<form onSubmit=${submit} noValidate className="grid gap-4 stag" style=${{gridTemplateColumns:'repeat(auto-fit,minmax(300px,1fr))'}}>
  <section className="glass r-card p-5 flex flex-col gap-3 col-span-full" style=${{'--i':0}}>
   <div className="flex items-center gap-4"><${LogoMark} s=${56}/><div><b className="text-lg font-semibold">${me?'Edit your mentor profile':'Teach what you aced'}</b><p className="m-0 muted text-sm">${me?'Change your subjects, rate, bio or schedule. New uploads are added to your profile and checked by an admin.':'Set up your mentor profile. An admin checks your uploads before your Verified badge appears.'}</p></div></div>
  </section>
  <section className="glass r-card p-5 flex flex-col gap-3" style=${{'--i':1}}>
   <span className="eyebrow">Subjects you can teach</span>
   <div className="flex flex-wrap gap-1.5">${SUBJECTS.map(s=>{const on=subs.includes(s);return html`<button key=${s} type="button" aria-pressed=${on} onClick=${()=>togg(subs,setSubs,s)} className=${cx('tag !text-[12px] !py-1.5 transition',on?'!bg-navy !text-white':'navy')}>${on&&html`<${Icon} n="check" s=${11} sw=${3}/>`}${s}</button>`})}</div>
   ${errs.subs&&html`<span className="err">${errs.subs}</span>`}
  </section>
  <section className="glass r-card p-5 flex flex-col gap-3" style=${{'--i':2}}>
   <div className="flex items-center gap-3"><${Avatar} m=${{name:db.user.name,pal:6,photo}} s=${56}/><div className="flex flex-col gap-1"><label className="btn sm cursor-pointer w-fit"><${Icon} n="camera" s=${15}/>${photo?'Change photo':'Add profile photo'}<input type="file" accept="image/*" className="sr-only" onChange=${async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{setPhoto(await readPhoto(f))}catch(er){act.toast('That image could not be read. Try a JPG or PNG.')}}}/></label><span className="help">A clear face photo helps learners trust you.</span></div></div>
   <div className="flex flex-col gap-1.5"><span className="lbl" id="bModesL">How you teach</span><div className="grid grid-cols-2 gap-2" role="group" aria-labelledby="bModesL">${MODES.map(([k,l,ic])=>{const on=modes.includes(k);return html`<button key=${k} type="button" aria-pressed=${on} onClick=${()=>setModes(v=>on?(v.length>1?v.filter(x=>x!==k):v):[...v,k])} className=${cx('rounded-2xl py-2.5 text-[13px] font-medium border transition inline-flex items-center justify-center gap-2',on?'bg-navy text-white border-navy shadow':'bg-white/70 border-white hover:bg-white')}><${Icon} n=${on?'check':ic} s=${15}/>${l}</button>`})}</div><span className="help">Students pick one of these when they book. Keep at least one on.</span></div>

    <div className="flex justify-between gap-3">${errs.bio?html`<span className="err">${errs.bio}</span>`:html`<span className="help">Say how you teach and what you're good at.</span>`}<span className=${cx('help tnum whitespace-nowrap',bio.trim().length>=30&&'!text-[color:var(--ok)]')}>${bio.trim().length<30?`${bio.trim().length}/30 min`:'✓ Good length'}</span></div></div>
  </section>
  <section className="glass r-card p-5 flex flex-col gap-3" style=${{'--i':3}}>
   <span className="eyebrow">Available schedule</span>
   <div className="grid grid-cols-7 gap-1.5">${DOW.map((d,i)=>{const on=days.includes(i);return html`<button key=${d} type="button" aria-pressed=${on} onClick=${()=>togg(days,setDays,i)} className=${cx('rounded-2xl py-2 text-xs font-semibold transition',on?'bg-navy text-white shadow':'bg-white/60 muted hover:bg-white')}>${d}</button>`})}</div>
   ${errs.days&&html`<span className="err">${errs.days}</span>`}
   <div className="grid grid-cols-2 gap-3"><div className="field"><label htmlFor="bFrom">From</label><select id="bFrom" className="inp" value=${from} onChange=${e=>setFrom(e.target.value)}>${times.map(t=>html`<option key=${t} value=${t}>${f12(toMin(t))}</option>`)}</select></div><div className="field"><label htmlFor="bTo">To</label><select id="bTo" className="inp" value=${to} onChange=${e=>setTo(e.target.value)}>${times.map(t=>html`<option key=${t} value=${t}>${f12(toMin(t))}</option>`)}</select></div></div>
   ${errs.time&&html`<span className="err">${errs.time}</span>`}

  <section className="glass r-card p-5 flex flex-col gap-3" style=${{'--i':4}}>

 const up=db.sessions.filter(s=>(s.status==='pending'||s.status==='confirmed')&&(s.date>todayStr||(s.date===todayStr&&toMin(s.end)>nowMin()))).sort((a,b)=>a.date.localeCompare(b.date)||toMin(a.start)-toMin(b.start));
 const rows=up.filter(s=>{if(!q.trim())return true;const t=(s.subject+' '+db.mentorOf(s.mentor).name+' '+(s.students||[]).map(x=>x.name).join(' ')).toLowerCase();return t.includes(q.trim().toLowerCase())});
 return html`<div key="ss" className="glass r-card p-2 overflow-x-auto enter">
  <div className="flex items-center gap-3 px-3 pt-2 pb-2 flex-wrap"><span className="text-sm muted mr-auto"><b className="text-navy">${up.length}</b> upcoming session${up.length===1?'':'s'}</span><input className="inp !h-9 !w-56" placeholder="Search subject, mentor, student" aria-label="Search sessions" value=${q} onInput=${e=>setQ(e.target.value)}/></div>

function Modal({onClose,children,w,label}){
 const[closing,setClosing]=useState(false);const ref=useRef(null);
 // close(next): run `next` only after the modal is gone, so it can't wipe out what `next` opens (e.g. the call)
 const close=next=>{const done=()=>{onClose();if(typeof next==='function')next()};if(matchMedia('(prefers-reduced-motion: reduce)').matches){done();return}setClosing(true);setTimeout(done,170)};
 useEffect(()=>{const k=e=>{if(e.key==='Escape')close()};addEventListener('keydown',k);const prev=document.activeElement;const f=ref.current&&ref.current.querySelector('[data-autofocus],input,select,textarea,button');f&&f.focus({preventScroll:true});return()=>{removeEventListener('keydown',k);prev&&prev.focus&&prev.focus({preventScroll:true})}},[]);
 return html`<div className=${cx('scrim',closing&&'closing')} onMouseDown=${e=>{if(e.target===e.currentTarget)close()}}><div ref=${ref} className="modal" role="dialog" aria-modal="true" aria-label=${label} style=${{'--w':w||'580px'}}>${React.createElement(Fragment,null,...[].concat(children(close)))}</div></div>`;
}

 const[start,setStart]=useState(preset?.start||m.from);const[dur,setDur]=useState(60);const[arr,setArr]=useState('Per Session');
 const[zoom,setZoom]=useState('');const[notes,setNotes]=useState('');const[errs,setErrs]=useState({});

 const wd=(pYmd(date).getDay()+6)%7;const inHours=m.days.includes(wd)&&toMin(start)>=toMin(m.from)&&toMin(start)+dur<=toMin(m.to);

function GroupClassModal({db,act,onClose}){

       <div className="h-px bg-navy/10 mx-2 my-1"></div>
       <label className="nav !h-10 cursor-pointer"><${Icon} n="camera" s=${16}/>${user.photo?'Change profile photo':'Add profile photo'}<input type="file" accept="image/*" className="sr-only" onChange=${async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{act.setPhoto(await readPhoto(f));setMenu(null)}catch(er){toast('That image could not be read. Try a JPG or PNG.')}}}/></label>
       ${!user.isAdmin&&html`<button type="button" className="nav !h-10" onClick=${()=>nav('become')}><${Icon} n="userplus" s=${16}/>${user.mentorId?'My mentor profile':'Become a mentor'}</button>`}
       <button type="button" className="nav !h-10" role="switch" aria-checked=${sndOn} onClick=${toggleSound}><${Icon} n=${sndOn?'bell':'eyeoff'} s=${16}/>${sndOn?'Sounds on · turn off':'Sounds off · turn on'}</button>

/* ---------- sound effects (made by the browser; no audio files) ---------- */
const soundOn=()=>{try{return localStorage.getItem('kh-sound')!=='off'}catch(e){return true}};
const sfx=(()=>{let ctx=null;let last={};let fileAudio=null;
 // Notifications, reminders and new messages use KnowHow's notification sound file; if it can't play, the built-in chime plays instead
 const playFile=()=>{try{if(!fileAudio){fileAudio=new Audio('/assets/notify.mp3');fileAudio.preload='auto';fileAudio.volume=.75}fileAudio.currentTime=0;const pr=fileAudio.play();return pr&&pr.then?pr.then(()=>true,()=>false):Promise.resolve(true)}catch(e){return Promise.resolve(false)}};
 const tone=(f,t0,dur,type,gain,f2)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(gain||0.07,t0+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g).connect(ctx.destination);o.start(t0);o.stop(t0+dur+0.02)};
 const S={
  msgIn:t=>{tone(880,t,.14,'sine',.07);tone(1318,t+.09,.18,'sine',.06)},
  msgOut:t=>{tone(660,t,.07,'sine',.035,990)},
  notify:t=>{tone(1047,t,.22,'triangle',.06);tone(1319,t+.1,.22,'triangle',.05);tone(1568,t+.2,.32,'triangle',.05)},
  reminder:t=>{S.notify(t);S.notify(t+.5)},
  join:t=>{tone(523,t,.14,'sine',.06);tone(784,t+.1,.2,'sine',.06)},
  leave:t=>{tone(784,t,.14,'sine',.05);tone(523,t+.1,.22,'sine',.05)},
  blip:t=>{tone(1200,t,.07,'sine',.04)},
  pop:t=>{tone(400,t,.09,'sine',.07,1400)}
 };
 return name=>{try{(window.__sfxLog=window.__sfxLog||[]).push(name);if(!soundOn()||!S[name])return;const now=Date.now();if(last[name]&&now-last[name]<250)return;last[name]=now;
  const AC=window.AudioContext||window.webkitAudioContext;const synth=()=>{if(!AC)return;ctx=ctx||new AC();if(ctx.state==='suspended')ctx.resume();S[name](ctx.currentTime+0.01)};
  if(name==='notify'||name==='reminder'||name==='msgIn'){playFile().then(ok=>{(window.__sfxFile=window.__sfxFile||[]).push(ok);if(!ok)synth()});return}
  synth()}catch(e){}};
})();

/* ---------- push notifications ---------- */
const PUSH_URL=SB_URL+'/functions/v1/push';
const pushSupported=()=>typeof window!=='undefined'&&'serviceWorker' in navigator&&'PushManager' in window&&typeof Notification!=='undefined';
const b64ToU8=b=>{const pad='='.repeat((4-b.length%4)%4);const raw=atob((b+pad).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0))};
const swReady=()=>Promise.race([navigator.serviceWorker.ready,new Promise(r=>setTimeout(()=>r(null),4000))]);
async function enablePush(){
 if(!pushSupported())return 'unsupported';
 const reg=await swReady();if(!reg)return 'no-sw';
 let sub=await reg.pushManager.getSubscription();
 if(!sub){let key=null;try{const{data,error}=await sb.rpc('push_public_key');if(!error&&data)key=data}catch(e){}
  if(!key){try{const r=await fetch(PUSH_URL+'?action=key');if(r.ok){const j=await r.json();key=j&&j.publicKey}}catch(e){}}
  if(!key)return 'not-setup';
  try{sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(key)})}catch(e){return 'blocked'}}
 const j=sub.toJSON();const{error}=await sb.rpc('save_push_subscription',{ep:j.endpoint,p256dh:j.keys.p256dh,auth_key:j.keys.auth,ua:navigator.userAgent||''});
 return error?'error':'ok';
}
async function disablePush(){try{if(!pushSupported())return;const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();
 if(sub){try{await sb.rpc('remove_push_subscription',{ep:sub.endpoint})}catch(e){}await sub.unsubscribe()}}catch(e){}}

function UpdateBar(){
 const[nv,setNv]=useState(false);
 useEffect(()=>{if(APP_BUILD.indexOf('__')===0||!/^https?:$/.test(location.protocol))return;let stop=false;
  const chk=async()=>{try{const r=await fetch('/?kh_v='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text();const m=t.match(/APP_BUILD='([^']+)'/);if(!stop&&m&&m[1]!==APP_BUILD)setNv(true)}catch(e){}};
  const f=()=>{if(document.visibilityState!=='hidden')chk()};const t0=setTimeout(chk,15000);const iv=setInterval(chk,5*60000);
  addEventListener('focus',f);document.addEventListener('visibilitychange',f);
  return()=>{stop=true;clearTimeout(t0);clearInterval(iv);removeEventListener('focus',f);document.removeEventListener('visibilitychange',f)}},[]);
 if(!nv)return null;
 return html`<div className="upd-bar" role="status"><${Icon} n="refresh" s=${16}/><span>A new version of KnowHow is ready.</span><button type="button" className="btn sm red" onClick=${()=>location.reload()}>Reload</button></div>`;
}
function themePref(){try{localStorage.removeItem('kh-theme')}catch(e){}return'light'} // dark mode was removed; KnowHow is always light
function applyTheme(t){const d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);
 const mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.setAttribute('content',d?'#0A1124':'#0F2557');return d}
applyTheme(themePref());
ReactDOM.createRoot(document.getElementById('root')).render(html`<${ErrorBoundary} full><${App}/><${UpdateBar}/></${ErrorBoundary}>`);
})();
</script>
